<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML游戏合集 - 丰富玩法体验</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #f1f1f1;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 3.2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff9a9e, #fad0c4, #fad0c4, #a1c4fd);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            font-size: 1.3rem;
            color: #b8c1ec;
            margin-bottom: 20px;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #e6e6e6;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #b8c1ec;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .game-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .game-btn {
            background: linear-gradient(145deg, #0f3460, #1a1a2e);
            border: none;
            border-radius: 12px;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
        }
        
        .game-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        
        .game-btn.active {
            background: linear-gradient(145deg, #533483, #0f3460);
            transform: translateY(-3px);
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            min-height: 500px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        
        .game-screen {
            display: none;
        }
        
        .game-screen.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .game-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 25px;
            color: #e6e6e6;
        }
        
        /* 猜数字游戏样式 */
        .guess-number-container {
            text-align: center;
        }
        
        .range-info {
            font-size: 1.4rem;
            margin: 20px 0;
            color: #b8c1ec;
        }
        
        .guess-input {
            width: 200px;
            padding: 15px;
            font-size: 1.8rem;
            text-align: center;
            border-radius: 10px;
            border: 2px solid #533483;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            margin-bottom: 20px;
        }
        
        .guess-btn {
            padding: 15px 40px;
            font-size: 1.3rem;
            background: linear-gradient(145deg, #533483, #0f3460);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }
        
        .guess-btn:hover {
            background: linear-gradient(145deg, #6a4ba3, #1a4b8c);
            transform: scale(1.05);
        }
        
        .guess-feedback {
            font-size: 1.5rem;
            min-height: 40px;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
        }
        
        .guess-history {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .history-item {
            background: rgba(83, 52, 131, 0.5);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }
        
        .difficulty-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .difficulty-btn.active {
            background: rgba(83, 52, 131, 0.8);
        }
        
        /* 打地鼠游戏样式 */
        .whack-mole-container {
            text-align: center;
        }
        
        .mole-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 500px;
            margin: 30px auto;
        }
        
        .mole-hole {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #3a2c5a 0%, #1a1a2e 100%);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
            cursor: pointer;
            box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.5);
        }
        
        .mole {
            width: 80%;
            height: 70%;
            background: #8b5a2b;
            border-radius: 40% 40% 30% 30%;
            position: absolute;
            bottom: -70%;
            left: 10%;
            transition: bottom 0.3s;
            cursor: pointer;
        }
        
        .mole.up {
            bottom: 5%;
        }
        
        .mole.whacked {
            background: #c0392b;
            transform: scale(0.9);
        }
        
        .mole-score {
            font-size: 2rem;
            margin: 20px 0;
        }
        
        .timer {
            font-size: 3rem;
            font-weight: bold;
            color: #ff9a9e;
            margin: 20px 0;
        }
        
        .start-btn {
            padding: 15px 50px;
            font-size: 1.5rem;
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        .start-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(145deg, #ff6b6b, #e74c3c);
        }
        
        /* 记忆卡片游戏样式 */
        .memory-container {
            text-align: center;
        }
        
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 30px auto;
        }
        
        .memory-card {
            width: 120px;
            height: 150px;
            perspective: 1000px;
            cursor: pointer;
        }
        
        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }
        
        .memory-card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        
        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }
        
        .card-front {
            background: linear-gradient(145deg, #533483, #0f3460);
            color: white;
        }
        
        .card-back {
            background: linear-gradient(145deg, #1a4b8c, #533483);
            color: white;
            transform: rotateY(180deg);
        }
        
        .memory-info {
            display: flex;
            justify-content: space-around;
            max-width: 500px;
            margin: 20px auto;
        }
        
        .memory-moves, .memory-pairs {
            font-size: 1.5rem;
        }
        
        .reset-btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            background: linear-gradient(145deg, #1abc9c, #16a085);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .reset-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(145deg, #2ecc71, #1abc9c);
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #b8c1ec;
            font-size: 0.9rem;
            margin-top: 20px;
        }
        
        @media (max-width: 768px) {
            .game-btn {
                padding: 12px 20px;
                font-size: 1rem;
            }
            
            .mole-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            
            .mole-hole {
                width: 90px;
                height: 90px;
            }
            
            .memory-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            
            .memory-card {
                width: 75px;
                height: 100px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .game-selector {
                flex-direction: column;
                align-items: center;
            }
            
            .game-btn {
                width: 90%;
            }
            
            .memory-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-gamepad"></i> HTML游戏合集</h1>
            <p class="subtitle">三种丰富玩法，挑战你的反应力、记忆力和逻辑思维！</p>
        </header>
        
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalScore">0</div>
                <div class="stat-label">总得分</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="gamesPlayed">0</div>
                <div class="stat-label">游戏次数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="bestScore">0</div>
                <div class="stat-label">最佳成绩</div>
            </div>
        </div>
        
        <div class="game-selector">
            <button class="game-btn active" data-game="guess-number">
                <i class="fas fa-question-circle"></i> 猜数字
            </button>
            <button class="game-btn" data-game="whack-mole">
                <i class="fas fa-paw"></i> 打地鼠
            </button>
            <button class="game-btn" data-game="memory-card">
                <i class="fas fa-brain"></i> 记忆卡片
            </button>
        </div>
        
        <div class="game-container">
            <!-- 猜数字游戏 -->
            <div class="game-screen active" id="guess-number">
                <h2 class="game-title">猜数字游戏</h2>
                <div class="guess-number-container">
                    <p class="range-info">我已经想好了一个 <span id="range">1-100</span> 之间的数字</p>
                    <p>你能在 <span id="maxAttempts">10</span> 次之内猜中它吗？</p>
                    
                    <div class="difficulty-selector">
                        <button class="difficulty-btn active" data-difficulty="easy">简单 (1-50)</button>
                        <button class="difficulty-btn" data-difficulty="medium">中等 (1-100)</button>
                        <button class="difficulty-btn" data-difficulty="hard">困难 (1-200)</button>
                    </div>
                    
                    <div style="margin: 30px 0;">
                        <input type="number" class="guess-input" id="guessInput" placeholder="输入数字" min="1" max="100">
                        <br>
                        <button class="guess-btn" id="guessSubmit">猜！</button>
                    </div>
                    
                    <div class="guess-feedback" id="guessFeedback">
                        输入一个数字开始游戏
                    </div>
                    
                    <div>
                        <p>剩余尝试次数: <span id="attemptsLeft">10</span></p>
                        <p>已尝试: <span id="attemptsCount">0</span> 次</p>
                    </div>
                    
                    <div class="guess-history" id="guessHistory"></div>
                    
                    <button class="reset-btn" id="guessReset" style="margin-top: 30px;">重新开始游戏</button>
                </div>
            </div>
            
            <!-- 打地鼠游戏 -->
            <div class="game-screen" id="whack-mole">
                <h2 class="game-title">打地鼠游戏</h2>
                <div class="whack-mole-container">
                    <div class="mole-score">得分: <span id="moleScore">0</span></div>
                    <div class="timer" id="moleTimer">60</div>
                    
                    <div class="mole-grid">
                        <div class="mole-hole" data-hole="0">
                            <div class="mole"></div>
                        </div>
                        <div class="mole-hole" data-hole="1">
                            <div class="mole"></div>
                        </div>
                        <div class="mole-hole" data-hole="2">
                            <div class="mole"></div>
                        </div>
                        <div class="mole-hole" data-hole="3">
                            <div class="mole"></div>
                        </div>
                        <div class="mole-hole" data-hole="4">
                            <div class="mole"></div>
                        </div>
                        <div class="mole-hole" data-hole="5">
                            <div class="mole"></div>
                        </div>
                        <div class="mole-hole" data-hole="6">
                            <div class="mole"></div>
                        </div>
                        <div class="mole-hole" data-hole="7">
                            <div class="mole"></div>
                        </div>
                        <div class="mole-hole" data-hole="8">
                            <div class="mole"></div>
                        </div>
                    </div>
                    
                    <button class="start-btn" id="moleStart">开始游戏</button>
                    <p style="margin-top: 20px;">点击冒出来的地鼠得分，游戏时间60秒</p>
                </div>
            </div>
            
            <!-- 记忆卡片游戏 -->
            <div class="game-screen" id="memory-card">
                <h2 class="game-title">记忆卡片游戏</h2>
                <div class="memory-container">
                    <div class="memory-info">
                        <div class="memory-moves">步数: <span id="memoryMoves">0</span></div>
                        <div class="memory-pairs">配对: <span id="memoryPairs">0</span>/8</div>
                    </div>
                    
                    <div class="memory-grid" id="memoryGrid"></div>
                    
                    <button class="reset-btn" id="memoryReset" style="margin-top: 30px;">重新开始游戏</button>
                    <p style="margin-top: 20px;">点击卡片翻开，找出所有匹配的卡片对</p>
                </div>
            </div>
        </div>
        
        <footer>
            <p>HTML游戏合集 &copy; 2023 | 使用 HTML5, CSS3 和 JavaScript 构建</p>
            <p>三种不同玩法，刷新页面数据会重置，可以添加本地存储功能保存进度</p>
        </footer>
    </div>

    <script>
        // 全局游戏数据
        const gameData = {
            totalScore: 0,
            gamesPlayed: 0,
            bestScore: 0
        };
        
        // 从本地存储加载游戏数据
        function loadGameData() {
            const savedData = localStorage.getItem('htmlGameCollection');
            if (savedData) {
                Object.assign(gameData, JSON.parse(savedData));
                updateStatsDisplay();
            }
        }
        
        // 保存游戏数据到本地存储
        function saveGameData() {
            localStorage.setItem('htmlGameCollection', JSON.stringify(gameData));
        }
        
        // 更新统计显示
        function updateStatsDisplay() {
            document.getElementById('totalScore').textContent = gameData.totalScore;
            document.getElementById('gamesPlayed').textContent = gameData.gamesPlayed;
            document.getElementById('bestScore').textContent = gameData.bestScore;
        }
        
        // 更新总得分
        function updateTotalScore(points) {
            gameData.totalScore += points;
            if (gameData.totalScore > gameData.bestScore) {
                gameData.bestScore = gameData.totalScore;
            }
            gameData.gamesPlayed++;
            updateStatsDisplay();
            saveGameData();
        }
        
        // 游戏选择器
        const gameButtons = document.querySelectorAll('.game-btn');
        const gameScreens = document.querySelectorAll('.game-screen');
        
        gameButtons.forEach(button => {
            button.addEventListener('click', () => {
                const gameId = button.getAttribute('data-game');
                
                // 更新活动按钮
                gameButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                
                // 显示对应游戏屏幕
                gameScreens.forEach(screen => screen.classList.remove('active'));
                document.getElementById(gameId).classList.add('active');
            });
        });
        
        // 猜数字游戏逻辑
        const guessNumberGame = {
            targetNumber: 0,
            attempts: 0,
            maxAttempts: 10,
            minRange: 1,
            maxRange: 100,
            gameActive: false,
            
            init() {
                this.setDifficulty('medium');
                this.resetGame();
                
                document.getElementById('guessSubmit').addEventListener('click', () => this.makeGuess());
                document.getElementById('guessInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.makeGuess();
                });
                
                document.getElementById('guessReset').addEventListener('click', () => this.resetGame());
                
                // 难度选择
                document.querySelectorAll('.difficulty-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const difficulty = e.target.getAttribute('data-difficulty');
                        this.setDifficulty(difficulty);
                        
                        // 更新活动按钮
                        document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                    });
                });
            },
            
            setDifficulty(difficulty) {
                switch(difficulty) {
                    case 'easy':
                        this.minRange = 1;
                        this.maxRange = 50;
                        this.maxAttempts = 8;
                        break;
                    case 'medium':
                        this.minRange = 1;
                        this.maxRange = 100;
                        this.maxAttempts = 10;
                        break;
                    case 'hard':
                        this.minRange = 1;
                        this.maxRange = 200;
                        this.maxAttempts = 12;
                        break;
                }
                
                document.getElementById('range').textContent = `${this.minRange}-${this.maxRange}`;
                document.getElementById('maxAttempts').textContent = this.maxAttempts;
                this.resetGame();
            },
            
            resetGame() {
                this.targetNumber = Math.floor(Math.random() * (this.maxRange - this.minRange + 1)) + this.minRange;
                this.attempts = 0;
                this.gameActive = true;
                
                document.getElementById('guessInput').value = '';
                document.getElementById('guessFeedback').textContent = `输入一个 ${this.minRange}-${this.maxRange} 之间的数字开始游戏`;
                document.getElementById('attemptsLeft').textContent = this.maxAttempts;
                document.getElementById('attemptsCount').textContent = this.attempts;
                document.getElementById('guessHistory').innerHTML = '';
                document.getElementById('guessInput').focus();
            },
            
            makeGuess() {
                if (!this.gameActive) return;
                
                const input = document.getElementById('guessInput');
                const guess = parseInt(input.value);
                
                // 验证输入
                if (isNaN(guess) || guess < this.minRange || guess > this.maxRange) {
                    document.getElementById('guessFeedback').textContent = `请输入一个有效的数字 (${this.minRange}-${this.maxRange})`;
                    input.focus();
                    return;
                }
                
                this.attempts++;
                const attemptsLeft = this.maxAttempts - this.attempts;
                
                // 更新显示
                document.getElementById('attemptsLeft').textContent = attemptsLeft;
                document.getElementById('attemptsCount').textContent = this.attempts;
                
                // 添加到历史记录
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.textContent = guess;
                document.getElementById('guessHistory').prepend(historyItem);
                
                // 检查猜测结果
                let feedback = '';
                if (guess === this.targetNumber) {
                    feedback = `🎉 恭喜！你猜对了！数字就是 ${this.targetNumber}。用了 ${this.attempts} 次尝试。`;
                    this.gameActive = false;
                    
                    // 计算得分并更新
                    const score = Math.max(100 - (this.attempts * 5), 10);
                    feedback += ` 获得 ${score} 分！`;
                    updateTotalScore(score);
                } else if (guess < this.targetNumber) {
                    feedback = `🔺 猜小了！尝试一个更大的数字。`;
                } else {
                    feedback = `🔻 猜大了！尝试一个更小的数字。`;
                }
                
                // 检查尝试次数是否用完
                if (this.gameActive && attemptsLeft <= 0) {
                    feedback = `😔 游戏结束！你没有在 ${this.maxAttempts} 次内猜中数字。正确数字是 ${this.targetNumber}。`;
                    this.gameActive = false;
                }
                
                document.getElementById('guessFeedback').textContent = feedback;
                input.value = '';
                input.focus();
            }
        };
        
        // 打地鼠游戏逻辑
        const whackMoleGame = {
            score: 0,
            timeLeft: 60,
            timer: null,
            gameActive: false,
            moles: [],
            moleInterval: null,
            
            init() {
                this.moles = document.querySelectorAll('.mole');
                
                document.getElementById('moleStart').addEventListener('click', () => this.startGame());
                
                // 为每个地鼠添加点击事件
                document.querySelectorAll('.mole-hole').forEach(hole => {
                    hole.addEventListener('click', (e) => {
                        if (!this.gameActive) return;
                        
                        const mole = hole.querySelector('.mole');
                        if (mole.classList.contains('up')) {
                            this.whackMole(mole);
                        }
                    });
                });
            },
            
            startGame() {
                if (this.gameActive) return;
                
                this.score = 0;
                this.timeLeft = 60;
                this.gameActive = true;
                
                document.getElementById('moleScore').textContent = this.score;
                document.getElementById('moleTimer').textContent = this.timeLeft;
                document.getElementById('moleStart').textContent = '游戏中...';
                document.getElementById('moleStart').disabled = true;
                
                // 清除所有地鼠
                this.moles.forEach(mole => {
                    mole.classList.remove('up', 'whacked');
                });
                
                // 开始计时器
                this.timer = setInterval(() => {
                    this.timeLeft--;
                    document.getElementById('moleTimer').textContent = this.timeLeft;
                    
                    if (this.timeLeft <= 0) {
                        this.endGame();
                    }
                }, 1000);
                
                // 开始地鼠出现
                this.moleInterval = setInterval(() => {
                    this.popRandomMole();
                }, 800);
            },
            
            popRandomMole() {
                if (!this.gameActive) return;
                
                // 隐藏所有地鼠
                this.moles.forEach(mole => {
                    mole.classList.remove('up');
                    mole.classList.remove('whacked');
                });
                
                // 随机选择一个地鼠显示
                const randomIndex = Math.floor(Math.random() * this.moles.length);
                const randomMole = this.moles[randomIndex];
                
                randomMole.classList.add('up');
                
                // 地鼠自动隐藏
                setTimeout(() => {
                    if (randomMole.classList.contains('up') && !randomMole.classList.contains('whacked')) {
                        randomMole.classList.remove('up');
                    }
                }, 600);
            },
            
            whackMole(mole) {
                if (!mole.classList.contains('whacked')) {
                    mole.classList.add('whacked');
                    this.score += 10;
                    document.getElementById('moleScore').textContent = this.score;
                    
                    // 播放音效（模拟）
                    this.playWhackSound();
                }
            },
            
            playWhackSound() {
                // 模拟声音效果
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 200;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            },
            
            endGame() {
                this.gameActive = false;
                clearInterval(this.timer);
                clearInterval(this.moleInterval);
                
                document.getElementById('moleStart').textContent = '开始游戏';
                document.getElementById('moleStart').disabled = false;
                
                // 隐藏所有地鼠
                this.moles.forEach(mole => {
                    mole.classList.remove('up', 'whacked');
                });
                
                // 更新总分
                updateTotalScore(this.score);
                
                // 显示结果
                setTimeout(() => {
                    alert(`游戏结束！你的得分是: ${this.score}`);
                }, 100);
            }
        };
        
        // 记忆卡片游戏逻辑
        const memoryCardGame = {
            cards: [],
            flippedCards: [],
            matchedPairs: 0,
            moves: 0,
            gameActive: false,
            cardValues: ['🍎', '🍌', '🍒', '🍕', '🍦', '🎮', '🎲', '🎯'],
            
            init() {
                this.createCards();
                document.getElementById('memoryReset').addEventListener('click', () => this.resetGame());
                this.resetGame();
            },
            
            createCards() {
                // 复制卡片值以创建对
                const cardPairs = [...this.cardValues, ...this.cardValues];
                
                // 洗牌算法
                for (let i = cardPairs.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [cardPairs[i], cardPairs[j]] = [cardPairs[j], cardPairs[i]];
                }
                
                // 创建卡片元素
                const memoryGrid = document.getElementById('memoryGrid');
                memoryGrid.innerHTML = '';
                
                cardPairs.forEach((value, index) => {
                    const card = document.createElement('div');
                    card.className = 'memory-card';
                    card.dataset.index = index;
                    card.dataset.value = value;
                    
                    card.innerHTML = `
                        <div class="card-inner">
                            <div class="card-front">?</div>
                            <div class="card-back">${value}</div>
                        </div>
                    `;
                    
                    card.addEventListener('click', () => this.flipCard(card));
                    memoryGrid.appendChild(card);
                });
                
                this.cards = document.querySelectorAll('.memory-card');
            },
            
            resetGame() {
                this.flippedCards = [];
                this.matchedPairs = 0;
                this.moves = 0;
                this.gameActive = true;
                
                document.getElementById('memoryMoves').textContent = this.moves;
                document.getElementById('memoryPairs').textContent = `${this.matchedPairs}/${this.cardValues.length}`;
                
                this.createCards();
            },
            
            flipCard(card) {
                if (!this.gameActive) return;
                if (card.classList.contains('flipped')) return;
                if (this.flippedCards.length >= 2) return;
                
                card.classList.add('flipped');
                this.flippedCards.push(card);
                
                if (this.flippedCards.length === 2) {
                    this.moves++;
                    document.getElementById('memoryMoves').textContent = this.moves;
                    this.checkMatch();
                }
            },
            
            checkMatch() {
                const [card1, card2] = this.flippedCards;
                const value1 = card1.dataset.value;
                const value2 = card2.dataset.value;
                
                if (value1 === value2) {
                    // 匹配成功
                    this.matchedPairs++;
                    document.getElementById('memoryPairs').textContent = `${this.matchedPairs}/${this.cardValues.length}`;
                    
                    // 添加匹配样式
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    
                    this.flippedCards = [];
                    
                    // 检查是否完成游戏
                    if (this.matchedPairs === this.cardValues.length) {
                        this.endGame();
                    }
                } else {
                    // 匹配失败，翻转回来
                    setTimeout(() => {
                        card1.classList.remove('flipped');
                        card2.classList.remove('flipped');
                        this.flippedCards = [];
                    }, 1000);
                }
            },
            
            endGame() {
                this.gameActive = false;
                
                // 计算得分
                const score = Math.max(300 - (this.moves * 5), 50);
                
                // 更新总分
                updateTotalScore(score);
                
                setTimeout(() => {
                    alert(`恭喜！你找到了所有配对！\n步数: ${this.moves}\n获得 ${score} 分！`);
                }, 500);
            }
        };
        
        // 初始化所有游戏
        document.addEventListener('DOMContentLoaded', () => {
            // 加载游戏数据
            loadGameData();
            
            // 初始化各游戏
            guessNumberGame.init();
            whackMoleGame.init();
            memoryCardGame.init();
        });
    </script>
</body>
